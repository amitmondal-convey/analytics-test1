<title>RCS Demo — Pacific Power × Convey</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #07090F;
  --surface:   #0E1219;
  --border:    rgba(255,255,255,0.07);
  --convey:    #0F6E56;
  --convey-lt: #1A9470;
  --pp-blue:   #1565C0;
  --pp-lt:     #1E88E5;
  --amber:     #D97706;
  --green:     #059669;
  --text:      #F0F0F2;
  --muted:     #6B7280;
}

html, body { height: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 20px 24px;
  overflow-x: hidden;
}

/* ── Header ── */
.page-header {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
  text-align: center;
}

.convey-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  color: var(--convey-lt);
  opacity: 0.85;
}

.convey-mark {
  width: 24px; height: 24px;
  background: var(--convey);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700; color: white; letter-spacing: 0.04em;
}

.page-title {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: #F0F0F2;
}

.page-subtitle {
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 0.01em;
}

.rcs-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(21,101,192,0.15);
  border: 1px solid rgba(21,101,192,0.35);
  color: #90CAF9;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 20px;
}

.rcs-badge-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #42A5F5;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.8); }
}

/* ── Stage ── */
.demo-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}

.phone-stage {
  display: flex;
  justify-content: center;
}

.phone-wrap {
  flex-shrink: 0;
}

/* ── Narrator panel ── */
.narrator {
  width: 240px;
  flex-shrink: 0;
  padding-top: 80px;
}

.narrator-step {
  display: none;
  flex-direction: column;
  gap: 10px;
  animation: fadeInUp 0.4s ease;
}
.narrator-step.visible { display: flex; }

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.narrator-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  color: var(--convey-lt);
}

.narrator-title {
  font-size: 16px;
  font-weight: 600;
  color: #E5E7EB;
  line-height: 1.3;
}

.narrator-body {
  font-size: 12px;
  color: #9CA3AF;
  line-height: 1.6;
}

.narrator-features {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 4px;
}

.narrator-feat {
  font-size: 9px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 10px;
  background: rgba(15,110,86,0.15);
  border: 1px solid rgba(15,110,86,0.3);
  color: #6EE7B7;
  letter-spacing: 0.04em;
}

/* ── Phone frame ── */

.phone-glow {
  position: absolute;
  inset: -40px;
  border-radius: 80px;
  background: radial-gradient(ellipse at center, var(--glow-color, rgba(21,101,192,0.25)) 0%, transparent 70%);
  transition: background 1.5s ease;
  pointer-events: none;
  z-index: 0;
}

.phone {
  position: relative;
  z-index: 1;
  width: 318px;
  height: 688px;
  background: linear-gradient(160deg, #2A2A2C 0%, #1A1A1C 40%, #111113 100%);
  border-radius: 54px;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.12),
    inset 0 1px 0 rgba(255,255,255,0.08),
    0 0 0 1px #000,
    0 60px 100px rgba(0,0,0,0.7),
    0 30px 50px rgba(0,0,0,0.5);
}

/* Side buttons */
.phone-btn-vol {
  position: absolute;
  left: -3px;
  top: 138px;
  width: 3px;
  background: linear-gradient(180deg, #3A3A3C, #2A2A2C);
  border-radius: 2px 0 0 2px;
  height: 36px;
  box-shadow: 0 50px 0 currentColor, 0 96px 0 currentColor;
}

.phone-btn-power {
  position: absolute;
  right: -3px;
  top: 160px;
  width: 3px;
  height: 64px;
  background: linear-gradient(180deg, #3A3A3C, #2A2A2C);
  border-radius: 0 2px 2px 0;
}

.phone-screen {
  position: absolute;
  top: 10px; left: 4px; right: 4px; bottom: 10px;
  background: #F2F2F7;
  border-radius: 47px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.dynamic-island {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: 122px;
  height: 36px;
  background: #0A0A0B;
  border-radius: 20px;
  z-index: 20;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.03);
}

/* ── Status bar ── */
.status-bar {
  height: 56px;
  padding: 18px 26px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  position: relative;
  z-index: 5;
}

.status-time {
  font-size: 15px;
  font-weight: 600;
  color: #1C1C1E;
  letter-spacing: -0.01em;
}

.status-icons {
  display: flex;
  align-items: center;
  gap: 6px;
}

.status-icons svg { color: #1C1C1E; }

/* ── Chat header ── */
.chat-header {
  background: rgba(242,242,247,0.95);
  backdrop-filter: blur(12px);
  border-bottom: 0.5px solid rgba(0,0,0,0.10);
  padding: 6px 14px 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.chat-back {
  font-size: 22px;
  color: var(--pp-blue);
  line-height: 1;
  padding-right: 2px;
}

.chat-avatar {
  width: 38px; height: 38px;
  border-radius: 50%;
  overflow: hidden;
  flex-shrink: 0;
  box-shadow: 0 0 0 1.5px rgba(21,101,192,0.25);
}

.chat-info { flex: 1; min-width: 0; }

.chat-name {
  font-size: 13px;
  font-weight: 600;
  color: #1C1C1E;
  display: flex;
  align-items: center;
  gap: 4px;
}

.chat-verified {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  color: #1565C0;
  font-size: 10px;
  font-weight: 600;
}

.chat-verified-icon {
  width: 14px; height: 14px;
  border-radius: 50%;
  background: #1565C0;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

.chat-sub {
  font-size: 10px;
  color: #8E8E93;
  margin-top: 1px;
}

.chat-video-btn {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: rgba(21,101,192,0.1);
  display: flex; align-items: center; justify-content: center;
  color: var(--pp-blue);
}

/* ── Thread ── */
.thread {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 12px 10px 6px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  scroll-behavior: smooth;
}

.thread::-webkit-scrollbar { width: 3px; }
.thread::-webkit-scrollbar-track { background: transparent; }
.thread::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 2px; }

/* ── Message animations ── */
.msg-row {
  display: flex;
  flex-direction: column;
  animation: msgIn 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
}

@keyframes msgIn {
  from { opacity: 0; transform: scale(0.85) translateY(10px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

.msg-row.from-utility { align-items: flex-start; }
.msg-row.from-customer { align-items: flex-end; }

/* ── Text bubbles ── */
.bubble {
  max-width: 220px;
  padding: 9px 13px;
  border-radius: 18px;
  font-size: 13px;
  line-height: 1.45;
}

.from-utility .bubble {
  background: var(--pp-blue);
  color: white;
  border-bottom-left-radius: 4px;
}

.from-customer .bubble {
  background: #E9E9EB;
  color: #1C1C1E;
  border-bottom-right-radius: 4px;
}

.from-customer.button-reply .bubble {
  background: #DCF8C6;
  color: #1C1C1E;
  border: 1px solid rgba(15,110,86,0.2);
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 5px;
}

.msg-time {
  font-size: 9px;
  color: #8E8E93;
  margin-top: 3px;
  padding: 0 4px;
}

.msg-receipt {
  font-size: 9px;
  color: #8E8E93;
  margin-top: 1px;
  padding: 0 4px;
  display: flex;
  align-items: center;
  gap: 3px;
}

/* ── Rich cards ── */
.rich-card {
  width: 248px;
  background: #FFFFFF;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 2px 16px rgba(0,0,0,0.12), 0 1px 4px rgba(0,0,0,0.08);
}

.rich-card-img {
  width: 100%;
  height: 110px;
  display: block;
}

.rich-card-body {
  padding: 11px 14px 12px;
}

.rich-card-eyebrow {
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  color: var(--pp-blue);
  margin-bottom: 4px;
}

.rich-card-title {
  font-size: 13px;
  font-weight: 700;
  color: #1C1C1E;
  margin-bottom: 5px;
  line-height: 1.3;
}

.rich-card-text {
  font-size: 11px;
  color: #6B7280;
  line-height: 1.55;
}

.rich-card-divider {
  height: 0.5px;
  background: #E5E7EB;
  margin: 0;
}

.rich-card-actions {
  display: flex;
  flex-direction: column;
}

.rca-btn {
  padding: 10px 14px;
  font-size: 12px;
  font-weight: 600;
  color: var(--convey);
  background: none;
  border: none;
  border-top: 0.5px solid #E5E7EB;
  cursor: pointer;
  text-align: center;
  transition: background 0.15s;
  font-family: inherit;
}

.rca-btn:first-child { border-top: none; }
.rca-btn:hover { background: #F0FDF4; }
.rca-btn.primary { color: var(--convey); font-weight: 700; }
.rca-btn.destructive { color: #6B7280; }

/* ── Video card ── */
.video-card {
  width: 220px;
  background: #1C1C1E;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 2px 12px rgba(0,0,0,0.2);
  cursor: pointer;
}

.video-thumb {
  width: 100%;
  height: 90px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.video-play {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,0.90);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.3);
  transition: transform 0.15s;
}

.video-card:hover .video-play { transform: scale(1.1); }

.video-card-info {
  padding: 8px 12px 10px;
}

.video-card-title {
  font-size: 11px;
  font-weight: 600;
  color: #F2F2F7;
  margin-bottom: 2px;
}

.video-card-meta {
  font-size: 9px;
  color: #8E8E93;
}

/* ── Image message ── */
.img-message {
  width: 220px;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}

.img-message svg {
  display: block;
  width: 100%;
  height: 130px;
}

/* ── Ticket card ── */
.ticket-card {
  width: 248px;
  background: #FFFFFF;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 2px 16px rgba(0,0,0,0.12);
}

.ticket-header {
  background: linear-gradient(135deg, #0F4C81 0%, #1565C0 100%);
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.ticket-icon {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: rgba(255,255,255,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}

.ticket-header-text { flex: 1; }

.ticket-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.65);
}

.ticket-id {
  font-size: 15px;
  font-weight: 700;
  color: white;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.02em;
}

.ticket-status {
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.ticket-status.open {
  background: rgba(245,158,11,0.2);
  color: #FCD34D;
  border: 1px solid rgba(245,158,11,0.4);
}

.ticket-status.closed {
  background: rgba(5,150,105,0.2);
  color: #6EE7B7;
  border: 1px solid rgba(5,150,105,0.4);
}

.ticket-body {
  padding: 11px 14px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.ticket-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
}

.ticket-row-label {
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #9CA3AF;
  width: 56px;
  flex-shrink: 0;
  padding-top: 1px;
}

.ticket-row-val {
  font-size: 11px;
  color: #374151;
  font-weight: 500;
  line-height: 1.4;
}

.ticket-track-btn {
  display: block;
  margin: 0;
  padding: 10px;
  background: none;
  border: none;
  border-top: 0.5px solid #E5E7EB;
  width: 100%;
  font-size: 12px;
  font-weight: 700;
  color: var(--convey);
  cursor: pointer;
  text-align: center;
  font-family: inherit;
  transition: background 0.15s;
}

.ticket-track-btn:hover { background: #F0FDF4; }

/* ── Timeskip ── */
.timeskip {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
  color: #8E8E93;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.02em;
}

.timeskip-line {
  flex: 1;
  height: 0.5px;
  background: #C7C7CC;
}

/* ── Typing indicator ── */
.typing-row {
  display: flex;
  align-items: flex-start;
}

.typing-bubble {
  display: flex;
  gap: 4px;
  padding: 10px 14px;
  background: #E9E9EB;
  border-radius: 18px;
  border-bottom-left-radius: 4px;
}

.typing-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #8E8E93;
  animation: tdot 1.3s infinite ease-in-out;
}

.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes tdot {
  0%, 55%, 100% { transform: translateY(0); opacity: 0.5; }
  27% { transform: translateY(-5px); opacity: 1; }
}

/* ── Status banner ── */
.status-banner {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: linear-gradient(135deg, rgba(5,150,105,0.12) 0%, rgba(15,110,86,0.12) 100%);
  border: 1px solid rgba(5,150,105,0.3);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 11px;
  font-weight: 600;
  color: #059669;
  margin: 4px 0;
}

.status-banner-icon {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: #059669;
  color: white;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
  flex-shrink: 0;
}

/* ── Input bar ── */
.input-bar {
  background: rgba(242,242,247,0.95);
  border-top: 0.5px solid rgba(0,0,0,0.08);
  padding: 8px 10px 22px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.input-field {
  flex: 1;
  background: white;
  border: 0.5px solid rgba(0,0,0,0.12);
  border-radius: 20px;
  padding: 8px 14px;
  font-size: 13px;
  color: #8E8E93;
}

.input-send {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--pp-blue);
  color: white;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}

/* ── Controls ── */
.controls-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.step-dots {
  display: flex;
  gap: 6px;
  align-items: center;
}

.step-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  cursor: pointer;
  transition: all 0.25s;
}

.step-dot.done { background: rgba(255,255,255,0.35); }
.step-dot.active { background: var(--convey-lt); width: 20px; border-radius: 3px; }

.nav-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 24px;
  border-radius: 24px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
  border: none;
  min-width: 100px;
  justify-content: center;
}

.next-btn {
  background: var(--convey);
  color: white;
  box-shadow: 0 4px 20px rgba(15,110,86,0.4);
}
.next-btn:hover:not(:disabled) { background: var(--convey-lt); box-shadow: 0 6px 28px rgba(15,110,86,0.5); }
.next-btn:active { transform: scale(0.97); }
.next-btn:disabled { background: #2D3748; box-shadow: none; color: #6B7280; cursor: default; }

.prev-btn {
  background: rgba(255,255,255,0.05);
  color: #9CA3AF;
  border: 1px solid rgba(255,255,255,0.1);
}
.prev-btn:hover:not(:disabled) { background: rgba(255,255,255,0.1); color: #E5E7EB; border-color: rgba(255,255,255,0.22); }
.prev-btn:disabled { opacity: 0.3; cursor: default; }

.step-counter {
  font-size: 12px;
  color: #6B7280;
  font-variant-numeric: tabular-nums;
  min-width: 72px;
  text-align: center;
  letter-spacing: 0.02em;
}

.reset-btn {
  background: none;
  border: 1px solid rgba(255,255,255,0.12);
  color: var(--muted);
  padding: 8px 18px;
  border-radius: 20px;
  font-size: 12px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}

.reset-btn:hover { border-color: rgba(255,255,255,0.25); color: #D1D5DB; }

.controls-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.current-narr {
  background: rgba(15,110,86,0.08);
  border: 1px solid rgba(15,110,86,0.2);
  border-radius: 12px;
  padding: 14px 22px;
  max-width: 400px;
  width: 100%;
  text-align: center;
  transition: opacity 0.3s;
}
.current-narr-title {
  font-size: 13px;
  font-weight: 700;
  color: #6EE7B7;
  margin-bottom: 5px;
  line-height: 1.3;
}
.current-narr-sub {
  font-size: 12px;
  color: #9CA3AF;
  line-height: 1.55;
}
.kbd-hint {
  font-size: 11px;
  color: #374151;
  margin-top: 2px;
}
.kbd-hint kbd {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 4px;
  padding: 1px 5px;
  font-family: inherit;
  font-size: 10px;
  color: #6B7280;
}

/* ── Feature pills ── */
.features {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  max-width: 700px;
}

.feat-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;

  const acts = card.actions && card.actions.length
    ? `<div class="rich-card-divider"></div><div class="rich-card-actions">${
        card.actions.map(a => `<button class="rca-btn${a.includes('Close') ? ' primary' : a.includes('Rate') ? ' destructive' : ''}" onclick="handleAction('${a}')">${a}</button>`).join('')
      }</div>`
    : '';
  return `<div class="rich-card">
    <img class="rich-card-img" src="data:image/svg+xml,${encodeURIComponent(card.image)}" alt=""/>
    <div class="rich-card-body">
      ${card.eyebrow ? `<div class="rich-card-eyebrow">${card.eyebrow}</div>` : ''}
      <div class="rich-card-title">${card.title}</div>
      <div class="rich-card-text">${card.text}</div>
    </div>
    ${acts}
  </div>`;
}

function renderVideoCard(card) {
  return `<div class="video-card">
    <div class="video-thumb">
      <img src="data:image/svg+xml,${encodeURIComponent(card.image)}" alt="" style="width:100%;height:100%;object-fit:cover;display:block;"/>
      <div class="video-play" style="position:absolute">▶</div>
    </div>
    <div class="video-card-info">
      <div class="video-card-title">${card.title}</div>
      <div class="video-card-meta">${card.meta}</div>
    </div>
  </div>`;
}

function renderTicketCard(ticket) {
  return `<div class="ticket-card">
    <div class="ticket-header">
      <div class="ticket-icon">🎫</div>
      <div class="ticket-header-text">
        <div class="ticket-label">Repair Ticket</div>
        <div class="ticket-id">#${ticket.id}</div>
      </div>
      <div class="ticket-status open">Open</div>
    </div>
    <div class="ticket-body">
      <div class="ticket-row">
        <div class="ticket-row-label">Location</div>
        <div class="ticket-row-val">${ticket.location}</div>
      </div>
      <div class="ticket-row">
        <div class="ticket-row-label">Created</div>
        <div class="ticket-row-val">${ticket.created}</div>
      </div>
      <div class="ticket-row">
        <div class="ticket-row-label">Priority</div>
        <div class="ticket-row-val">${ticket.priority}</div>
      </div>
    </div>
    <button class="ticket-track-btn">Track Status →</button>
  </div>`;
}

function renderImageMsg(msg) {
  return `<div class="img-message">
    <img src="data:image/svg+xml,${encodeURIComponent(msg.image)}" alt="${msg.caption || ''}" style="width:100%;height:130px;display:block;object-fit:cover;"/>
  </div>`;
}

function buildMessageEl(msg) {
  const row = document.createElement('div');
  row.className = 'msg-row from-' + msg.sender + (msg.type === 'button-reply' ? ' button-reply' : '');
  row.dataset.id = msg.id;

  let inner = '';

  if (msg.type === 'rich-card') {
    inner = renderRichCard(msg.card, msg.sender);
    if (msg.time) inner += `<div class="msg-time">${msg.time}</div>`;
  } else if (msg.type === 'video-card') {
    inner = renderVideoCard(msg.card);
    if (msg.time) inner += `<div class="msg-time">${msg.time}</div>`;
  } else if (msg.type === 'ticket-card') {
    inner = renderTicketCard(msg.ticket);
    if (msg.time) inner += `<div class="msg-time">${msg.time}</div>`;
  } else if (msg.type === 'image') {
    inner = renderImageMsg(msg);
    if (msg.time) inner += `<div class="msg-time msg-receipt">✓✓ ${msg.time}</div>`;
  } else if (msg.type === 'text') {
    inner = `<div class="bubble">${msg.text}</div>`;
    if (msg.sender === 'customer') {
      inner += `<div class="msg-receipt">✓✓ Delivered · ${msg.time}</div>`;
    } else {
      inner += `<div class="msg-time">${msg.time}</div>`;
    }
  } else if (msg.type === 'button-reply') {
    inner = `<div class="bubble">${msg.text}</div>`;
    inner += `<div class="msg-receipt">✓✓ Delivered · ${msg.time}</div>`;
  } else if (msg.type === 'timeskip') {
    row.className = '';
    inner = `<div class="timeskip"><div class="timeskip-line"></div>${msg.text}<div class="timeskip-line"></div></div>`;
  } else if (msg.type === 'status-banner') {
    row.className = '';
    inner = `<div class="status-banner"><div class="status-banner-icon">✓</div>${msg.text}</div>`;
  }

  row.innerHTML = inner;
  return row;
}

function showTyping() {
  const thread = document.getElementById('thread');
  const el = document.createElement('div');
  el.className = 'typing-row';
  el.id = 'typing-indicator';
  el.innerHTML = `<div class="typing-bubble"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
  thread.appendChild(el);
  thread.scrollTop = thread.scrollHeight;
  return el;
}

function removeTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

// ── Feature highlights ───────────────────────────────────────────────────────
function highlightFeatures(features) {
  document.querySelectorAll('.feat-pill').forEach(p => {
    const f = p.dataset.feat;
    if (features.includes(f)) {
      p.classList.add('active');
    } else {
      p.classList.remove('active');
    }
  });
}

// ── Glow ─────────────────────────────────────────────────────────────────────
function setGlow(color) {
  document.getElementById('phone-glow').style.setProperty('--glow-color', color || 'transparent');
  document.getElementById('phone-glow').style.background =
    `radial-gradient(ellipse at center, ${color} 0%, transparent 70%)`;
}

function buildNarrator() {}
function updateNarrator() {}

// ── Step dots ────────────────────────────────────────────────────────────────
function buildDots() {}
function updateDots() {}

// ── Playback ─────────────────────────────────────────────────────────────────

function showMsgAtIndex(idx) {
  const msg = MSGS[idx];
  if (!msg) return;
  const thread = document.getElementById('thread');
  if (thread.querySelector('[data-id="' + msg.id + '"]')) return;
  const el = buildMessageEl(msg);
  thread.appendChild(el);
  thread.scrollTop = thread.scrollHeight;
  if (msg.glow) setGlow(msg.glow);
  if (msg.features) highlightFeatures(msg.features);
  currentStep = idx;
  updateControls();
}

function showNext() {
  const next = currentStep + 1;
  if (next < MSGS.length) showMsgAtIndex(next);
}

function showPrev() {
  if (currentStep < 0) return;
  const thread = document.getElementById('thread');
  const last = thread.querySelector('[data-id="' + MSGS[currentStep].id + '"]');
  if (last) last.remove();
  currentStep -= 1;
  if (currentStep >= 0 && MSGS[currentStep].glow) setGlow(MSGS[currentStep].glow);
  else setGlow('rgba(21,101,192,0.15)');
  updateControls();
}

function updateControls() {
  const prev = document.getElementById('prev-btn');
  const next = document.getElementById('next-btn');
  const ctr  = document.getElementById('step-counter');
  if (prev) prev.disabled = currentStep < 0;
  if (next) next.disabled = currentStep >= MSGS.length - 1;
  if (ctr)  ctr.textContent = (currentStep + 1) + ' / ' + MSGS.length;
}

function handleAction() {}

// ── Phone sizing ─────────────────────────────────────────────────────────────
function fitPhone() {
  const headerEl = document.querySelector('.page-header');
  const navEl = document.getElementById('nav-controls');
  const headerH = (headerEl ? headerEl.offsetHeight : 120) + (navEl ? navEl.offsetHeight + 20 : 60) + 48;
  const availH = window.innerHeight - headerH;
  const availW = window.innerWidth - 48;
  const scaleH = availH / 688;
  const scaleW = availW / 318;
  const scale = Math.min(scaleH, scaleW, 2.2);
  const wrap = document.querySelector('.phone-wrap');
  if (wrap) {
    // zoom affects layout naturally — no clipping, no transform-origin issues
    wrap.style.zoom = scale;
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  setGlow('rgba(21,101,192,0.15)');
  fitPhone();
  window.addEventListener('resize', fitPhone);
  updateControls();

  document.getElementById('next-btn').addEventListener('click', showNext);
  document.getElementById('prev-btn').addEventListener('click', showPrev);

  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      showNext();
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      showPrev();
    }
  });
});
</script>
